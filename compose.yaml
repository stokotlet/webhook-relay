name: webhook-relay
x-relay-env: &relay-env
  DATABASE_URL: postgres://relay:relay@db:5432/relay?sslmode=disable
  API_KEY: ${API_KEY:-local-development-key-change-me}
  ALLOW_PRIVATE_TARGETS: "true"
  ADMIN_ADDR: :9090
  WORKERS: "4"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [-mode, migrate]
    environment: *relay-env
    depends_on:
      db:
        condition: service_healthy
  relay:
    build: .
    environment: *relay-env
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:9090:9090
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/readyz]
      interval: 3s
      timeout: 2s
      retries: 20
    stop_grace_period: 20s
  receiver:
    build: .
    entrypoint: [receiver]
    environment:
      RECEIVER_ADMIN_ADDR: :8091
    ports:
      - 127.0.0.1:8091:8091
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9091:9090
    depends_on: [relay]
  grafana:
    image: grafana/grafana:12.0.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-demo-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
    depends_on: [prometheus]
volumes:
  database:
